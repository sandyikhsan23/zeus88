<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      body {
        width: 320px;
        margin: 0;
        font: 13px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #14213d;
        background: #fff;
      }
      header {
        background: #2c3c5e;
        color: #fff;
        padding: 10px 12px;
        font-weight: 700;
        font-style: italic;
        letter-spacing: -0.02em;
      }
      header b { color: #a3e635; }
      .body { padding: 12px; }
      .row { margin-bottom: 8px; }
      .label {
        font-size: 11px;
        color: #4a5773;
        margin-bottom: 1px;
      }
      .val { font-weight: 600; word-break: break-word; }
      .val.dim { font-weight: 400; color: #4a5773; font-size: 12px; }
      button {
        width: 100%;
        padding: 9px;
        border: 0;
        border-radius: 8px;
        background: #1c6e3d;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled { opacity: 0.6; cursor: default; }
      .msg {
        margin-top: 8px;
        font-size: 12px;
        padding: 7px 9px;
        border-radius: 6px;
      }
      .msg.err { background: #fdecec; color: #8a3a3f; }
      .msg.ok { background: #eafaf0; color: #1c6e3d; }
      .foot { margin-top: 9px; font-size: 11px; }
      a { color: #1c6e3d; }
    </style>
  </head>
  <body>
    <header>Zeus<b>88</b> — Simpan Lowongan</header>
    <div class="body">
      <div id="preview">
        <div class="val dim">Membaca halaman…</div>
      </div>
      <button id="save">Simpan ke Zeus88</button>
      <div id="msg"></div>
      <div class="foot"><a id="opts" href="#">Atur URL Zeus88</a></div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
